name: Validate community strategies
on:
  pull_request:
    paths: ["community/strategies/**", "src/stratspec.js", "src/core.js", "src/strategies2.js", "tools/validate-strategies.js"]
  push:
    branches: [main]
    paths: ["community/strategies/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node tools/validate-strategies.js
