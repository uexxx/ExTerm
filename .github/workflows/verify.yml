name: ExTerm Release Verification
on:
  push:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Core Source & Syntax
        run: |
          test -f src/index.html
          test -f build.py
          for f in src/*.js; do node --check "$f"; done