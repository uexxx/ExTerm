name: tests
# Runs every ExTerm test suite (unit, launcher, browser end-to-end) on each push and pull request.
# No external network is needed: the tests mock every third-party API.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (the tests use the runner's Google Chrome)
        run: |
          sudo mkdir -p /opt/npm-tools && sudo chown "$USER" /opt/npm-tools
          cd /opt/npm-tools && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1
          pip install pillow
      - name: Run all suites
        run: bash test/run-all.sh
